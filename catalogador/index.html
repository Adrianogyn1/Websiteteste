<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Monitoramento de Roletas (Bootstrap)</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    
    <style>
        body {
            background-color: #f4f4f9;
        }
        .header-status {
            font-size: 1.25rem;
        }
        .room-card {
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: box-shadow 0.3s;
        }
        .room-card:hover {
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }
        
        /* Estilos do Histórico */
        #historyList {
            display: flex;
            flex-direction: row-reverse; /* Mostra o mais recente à esquerda */
            flex-wrap: wrap;
            gap: 5px;
            max-height: 250px;
            overflow-y: auto;
            padding: 10px;
            background-color: #e9ecef;
            border-radius: 5px;
            border: 1px solid #dee2e6;
        }
        .history-item {
            font-size: 1.1em;
            font-weight: bold;
            width: 35px;
            height: 35px;
            line-height: 35px;
            text-align: center;
            border-radius: 50%;
            color: white;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.3s ease-out, opacity 0.3s ease-out;
            opacity: 1;
        }
        
        /* Cores */
        .red { background-color: #dc3545; }
        .black { background-color: #343a40; }
        .green { background-color: #28a745; }
        .unknown { background-color: #6c757d; }
    </style>
</head>
<body>

    <div class="container my-4">
        <h1 class="text-primary border-bottom pb-2">Monitor de Roletas em Tempo Real</h1>
        
        <div id="status" class="alert alert-light shadow-sm d-flex justify-content-between align-items-center">
            <span class="header-status">Status da Conexão:</span>
            <span id="connectionStatus" class="badge bg-danger">Desconectado</span>
        </div>

        <h2 class="mt-4">Selecione a Roleta:</h2>
        <div id="roomSelector" class="mb-4 d-flex flex-wrap gap-2">
            </div>

        <div id="currentRoomDisplay" class="room-card card p-4" style="display: none;">
            <h2 id="currentRoomTitle" class="card-title text-info border-bottom pb-2 mb-3"></h2>
            
            <h4 class="mb-3">Histórico de Rodadas (Últimas 50)</h4>
            
            <div id="historyList" class="history-list">
                </div>
            
            <small class="mt-3 text-muted">Clique em um número para ver os detalhes da rodada.</small>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Use a porta 3010
        const SOCKET_IO_SERVER = 'http://localhost:3010'; 
        const socket = io(SOCKET_IO_SERVER);
        
        // Uso de jQuery para seleção
        const $connectionStatus = $('#connectionStatus');
        const $roomSelector = $('#roomSelector');
        const $currentRoomDisplay = $('#currentRoomDisplay');
        const $currentRoomTitle = $('#currentRoomTitle');
        const $historyList = $('#historyList');
        
        let currentRoom = null; 
        
        // ==========================================================
        // === FUNÇÕES AUXILIARES ===
        // ==========================================================

        function getRoomName(displayName) {
            return displayName.toLowerCase().replace(/\s/g, '');
        }

        function getColorClass(num) {
            if (num === 0) return 'green';
            if (num === 'Aguardando...' || num === 'N/A') return 'unknown';

            const redNumbers = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];
            if (redNumbers.includes(num)) return 'red';
            return 'black';
        }
        
        // ==========================================================
        // === FUNÇÕES DE RENDERIZAÇÃO E ATUALIZAÇÃO ===
        // ==========================================================

        function joinRoom(roomName, displayName) {
            if (currentRoom === roomName) return;

            currentRoom = roomName;
            
            // 1. Envia o comando para o servidor Socket.IO
            socket.emit('joinRoom', roomName);
            
            // 2. Atualiza o display e limpa o histórico antigo
            $currentRoomDisplay.show();
            $currentRoomTitle.text(displayName);
            $historyList.empty(); // Limpa histórico com jQuery
            
            // 3. Atualiza o estado visual do seletor
            $roomSelector.find('button').removeClass('active btn-success').addClass('btn-primary');
            $roomSelector.find(`button[data-room-name="${roomName}"]`).removeClass('btn-primary').addClass('active btn-success');
            
            console.log(`Entrando na sala: ${roomName}. Aguardando histórico...`);
        }

        /**
         * Cria um elemento visual para um único resultado usando jQuery.
         */
        function createHistoryItem(rodada) {
            const colorClass = getColorClass(rodada.NumeroVencedor);
            
            const $item = $('<div>', {
                class: `history-item ${colorClass}`,
                text: rodada.NumeroVencedor,
                title: `${rodada.DataHora}\nID: ${rodada.id}`
            });
            
            // Adicionar clique para ver mais detalhes
            $item.on('click', () => {
                alert(`Detalhes da Rodada:\nRoleta: ${rodada.NomeDaRoleta}\nNúmero: ${rodada.NumeroVencedor}\nData/Hora: ${rodada.DataHora}\nID: ${rodada.id}`);
            });

            return $item;
        }
        
        /**
         * Preenche o histórico completo (chamado APENAS pelo 'fullHistory').
         */
        function renderFullHistory(historicoArray) {
            $historyList.empty(); 
            
            // O servidor envia o array do mais antigo para o mais novo.
            // Invertemos para usar .append() e manter a ordem do CSS (mais recente à esquerda).
            // NOTA: Com flex-direction: row-reverse, podemos usar .prepend() no loop, 
            // mas usaremos .reverse() + .append() para maior clareza aqui.
            
            const reversedHistorico = [...historicoArray].reverse(); // Cria cópia e inverte para processamento
            
            reversedHistorico.forEach(rodada => {
                const $item = createHistoryItem(rodada);
                $historyList.append($item);
            });
            
            console.log(`Histórico completo de ${historicoArray.length} rodadas exibido.`);
        }

        /**
         * Adiciona novos resultados em tempo real (chamado pelo 'novasRodadas').
         */
        function addNewResults(novasRodadasArray) {
            // O Catalogador envia em ordem cronológica (antigo -> novo)
            novasRodadasArray.forEach(rodada => {
                const $item = createHistoryItem(rodada);
                
                // 1. Efeito visual para o novo item
                $item.css({ transform: 'scale(0.8)', opacity: '0' });
                
                // Adiciona o novo item no início da lista (esquerda)
                $historyList.prepend($item); 
                
                // Animação para que o item "apareça"
                setTimeout(() => {
                    $item.css({ transform: 'scale(1)', opacity: '1' });
                }, 10);
                
                // 2. Mantém o limite (50 itens)
                while ($historyList.children().length > 50) {
                    $historyList.children().last().remove(); // Remove o item mais antigo (o último da lista)
                }
            });
        }
        
        // ==========================================================
        // === LÓGICA DO SOCKET.IO E EVENTOS ===
        // ==========================================================
        
        function renderRoomSelector(rooms) {
            $roomSelector.empty();
            for (const roomName in rooms) {
                const displayName = rooms[roomName];
                const $button = $('<button>', {
                    type: 'button',
                    class: 'btn btn-primary',
                    text: displayName,
                    'data-room-name': roomName
                });
                
                $button.on('click', function() {
                    joinRoom(roomName, displayName);
                });
                $roomSelector.append($button);
            }
        }

        socket.on('connect', () => {
            $connectionStatus.removeClass('bg-danger bg-warning').addClass('bg-success').text('Conectado');
            socket.emit('requestRooms'); 
        });

        socket.on('disconnect', () => {
            $connectionStatus.removeClass('bg-success bg-warning').addClass('bg-danger').text('Desconectado');
            $currentRoomDisplay.hide();
        });
        
        socket.on('connect_error', (err) => {
            $connectionStatus.removeClass('bg-success bg-danger').addClass('bg-warning').text('Erro de Conexão');
            console.error('Erro de conexão:', err.message);
        });

        // 1. Recebe a lista de salas disponíveis
        socket.on('availableRooms', (rooms) => {
            renderRoomSelector(rooms);
        });

        // 2. Recebe o HISTÓRICO COMPLETO (Chamado após 'joinRoom')
        socket.on('fullHistory', (historico) => {
            renderFullHistory(historico);
        });

        // 3. Recebe as ATUALIZAÇÕES EM TEMPO REAL
        socket.on('novasRodadas', (rodadas) => {
            if (currentRoom) {
                addNewResults(rodadas);
            }
        });
        
        // 4. Recebe o placeholder (caso a sala esteja vazia)
        socket.on('lastUpdate', (latestRodada) => {
             // Se o histórico está vazio e recebe o placeholder
             if ($historyList.children().length === 0 && latestRodada.NumeroVencedor === 'Aguardando') {
                 // Pode adicionar um item placeholder aqui, se desejar
             }
        });
        
    </script>
</body>
</html>
