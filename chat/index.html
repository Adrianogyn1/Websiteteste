<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Chat com Salas (Node.js + Socket.IO)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body, html { height: 100%; margin: 0; }
        .chat-container { height: calc(100vh - 56px); display: flex; flex-direction: column; }
        #messages { 
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 15px; 
            border: 1px solid #ccc;
            background-color: #f8f9fa;
        }
        .message-system { color: gray; font-style: italic; text-align: center; }
        .message-user { margin-bottom: 5px; padding: 5px 10px; border-radius: 10px; }
        .my-message { background-color: #d1e7dd; text-align: right; }
        .other-message { background-color: #fff; text-align: left; }
    </style>
</head>
<body>

    <div class="modal fade" id="entryModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="entryModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="entryModalLabel">Entrar no Chat</h5>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="usernameInput" class="form-label">Seu Nome/Apelido</label>
              <input type="text" class="form-control" id="usernameInput" placeholder="Ex: Joãozinho">
            </div>
            <div class="mb-3">
              <label for="roomInput" class="form-label">Nome da Sala</label>
              <input type="text" class="form-control" id="roomInput" placeholder="Ex: Geral ou Projeto_X">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" id="joinButton">Entrar</button>
          </div>
        </div>
      </div>
    </div>
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand">Chat (Telegram-like)</span>
            <span class="navbar-text" id="currentRoomDisplay">
                Sala: Nenhuma
            </span>
        </div>
    </nav>

    <div class="container-fluid chat-container">
        <div id="messages" class="mt-3 mb-3">
            <p class="message-system">Aguardando sua entrada em uma sala...</p>
        </div>

        <form id="form" class="mb-3">
            <div class="input-group">
                <input id="m" autocomplete="off" class="form-control" placeholder="Digite sua mensagem..." disabled/>
                <button type="submit" class="btn btn-success" id="sendButton" disabled>Enviar</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <script>
        $(function () {
            // =========================================================
            // AQUI ESTÁ A CORREÇÃO PARA USAR O ENDEREÇO IP ESPECÍFICO
            // =========================================================
            const SERVER_URL = 'http://35.209.27.45:3000'; 
            const socket = io(SERVER_URL);
            // =========================================================

            let username = '';
            let currentRoom = '';
            
            const entryModal = new bootstrap.Modal(document.getElementById('entryModal'));
            entryModal.show();

            // Lógica de ENTRAR na Sala
            $('#joinButton').click(function() {
                username = $('#usernameInput').val().trim();
                const roomName = $('#roomInput').val().trim();

                if (username && roomName) {
                    socket.emit('join room', roomName, username, function(roomJoined) {
                        currentRoom = roomJoined;
                        $('#currentRoomDisplay').text(`Sala: ${currentRoom} (Usuário: ${username})`);
                        $('#messages').empty();
                        $('#messages').append('<p class="message-system">Você entrou na sala ' + currentRoom + '</p>');
                        
                        $('#m').prop('disabled', false);
                        $('#sendButton').prop('disabled', false);
                        $('#m').focus();
                        
                        entryModal.hide();
                    });
                } else {
                    alert('Por favor, preencha seu nome e o nome da sala.');
                }
            });

            // Lógica de ENVIAR Mensagem
            $('#form').submit(function(e) {
                e.preventDefault();
                const messageText = $('#m').val().trim();
                
                if (messageText && currentRoom) {
                    socket.emit('chat message', messageText);
                    
                    addMessage({ user: username, msg: messageText, type: 'user' }, true);
                    
                    $('#m').val('');
                }
                return false;
            });

            // Lógica de RECEBER Mensagem
            socket.on('chat message', function(data) {
                if (data.user !== username || data.type === 'system') {
                    addMessage(data, false);
                }
            });
            
            // Lógica de tratamento de erros de conexão
            socket.on('connect_error', (err) => {
                console.error("Erro de conexão com o servidor:", err.message);
                $('#messages').append('<p class="message-system" style="color: red;">Erro ao conectar ao servidor. Verifique o endereço e se o servidor Node.js está rodando.</p>');
            });


            // Função para adicionar mensagem ao DOM
            function addMessage(data, isMine) {
                let msgElement;
                const messagesDiv = $('#messages');

                if (data.type === 'system') {
                    msgElement = $('<p>').addClass('message-system').text(data.msg);
                } else {
                    const userClass = isMine ? 'my-message' : 'other-message';
                    
                    const userSpan = $('<span>').css('font-weight', 'bold').text(data.user + ': ');
                    
                    msgElement = $('<div>')
                        .addClass('message-user ' + userClass + ' shadow-sm')
                        .append(userSpan)
                        .append(data.msg);
                }

                messagesDiv.append(msgElement);
                messagesDiv.scrollTop(messagesDiv[0].scrollHeight);
            }
        });
    </script>
</body>
</html>
